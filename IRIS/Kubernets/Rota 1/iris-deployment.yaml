# iris-deployment.yaml
#
# Sobe 1 réplica do InterSystems IRIS Community Edition, com os dados
# persistidos no PVC "iris-data" (ver iris-pvc.yaml) através da
# variável ISC_DATA_DIRECTORY, que configura o "durable %SYS".

apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris
  labels:
    app: iris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iris
  template:
    metadata:
      labels:
        app: iris
    spec:
      containers:
        - name: iris
          image: intersystems/iris-community:latest-em
          ports:
            - containerPort: 52773
              name: webserver
            - containerPort: 1972
              name: superserver
          volumeMounts:
            - name: durable
              mountPath: /durable
          env:
            - name: ISC_DATA_DIRECTORY
              value: /durable/irissys
      volumes:
        - name: durable
          persistentVolumeClaim:
            claimName: iris-data
