<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'Segoe UI', Arial, sans-serif">
  <style>
    .caption { fill: #1a1d23; font-size: 20px; font-weight: 700; }
    .identity-box { fill: #eaf4ff; stroke: #0078d4; stroke-width: 1.5; }
    .field-box { fill: #ffffff; stroke: #c7ccd4; stroke-width: 1.2; }
    .title-14 { fill: #1a1d23; font-size: 14px; font-weight: 700; }
    .mono-13 { fill: #1a1d23; font-size: 12.5px; font-family: 'Consolas', 'Courier New', monospace; }
    .mono-key { fill: #0078d4; font-size: 12.5px; font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    .sub-11 { fill: #6b7280; font-size: 11px; }
    .arrow-blue { stroke: #0078d4; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead-blue); }
  </style>

  <defs>
    <marker id="arrowhead-blue" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#0078d4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
  <text x="30" y="34" class="caption">Diagrama: campos da ServiceAccount e da Federated Identity Credential que precisam corresponder</text>

  <!-- ServiceAccount -->
  <rect x="30" y="70" width="440" height="300" rx="12" class="identity-box"/>
  <text x="50" y="96" class="title-14">ServiceAccount (Kubernetes)</text>

  <rect x="50" y="112" width="400" height="34" rx="6" class="field-box"/>
  <text x="62" y="134" class="mono-13">metadata.namespace: <tspan class="mono-key">iko</tspan></text>

  <rect x="50" y="154" width="400" height="34" rx="6" class="field-box"/>
  <text x="62" y="176" class="mono-13">metadata.name: <tspan class="mono-key">iris-cloud-ops</tspan></text>

  <rect x="50" y="196" width="400" height="48" rx="6" class="field-box"/>
  <text x="62" y="216" class="mono-13">annotations["azure.workload.identity/client-id"]</text>
  <text x="62" y="232" class="mono-key">= clientId da UAMI iris-workload-identity</text>

  <rect x="50" y="252" width="400" height="34" rx="6" class="field-box"/>
  <text x="62" y="274" class="mono-13">annotations["azure.workload.identity/tenant-id"]</text>

  <rect x="50" y="294" width="400" height="34" rx="6" class="field-box"/>
  <text x="62" y="316" class="mono-13">labels["azure.workload.identity/use"] = <tspan class="mono-key">"true"</tspan></text>

  <text x="50" y="352" class="sub-11">O label "use: true" é obrigatório — sem ele, o webhook</text>
  <text x="50" y="366" class="sub-11">mutante não injeta o token projetado no Pod.</text>

  <!-- Federated Identity Credential -->
  <rect x="530" y="70" width="440" height="300" rx="12" class="identity-box"/>
  <text x="550" y="96" class="title-14">Federated Identity Credential (Entra ID)</text>

  <rect x="550" y="112" width="400" height="34" rx="6" class="field-box"/>
  <text x="562" y="134" class="mono-13">--identity-name: <tspan class="mono-key">iris-workload-identity</tspan></text>

  <rect x="550" y="154" width="400" height="34" rx="6" class="field-box"/>
  <text x="562" y="176" class="mono-13">--issuer: URL do OIDC issuer do AKS</text>

  <rect x="550" y="196" width="400" height="48" rx="6" class="field-box"/>
  <text x="562" y="216" class="mono-13">--subject:</text>
  <text x="562" y="232" class="mono-key">system:serviceaccount:iko:iris-cloud-ops</text>

  <rect x="550" y="252" width="400" height="34" rx="6" class="field-box"/>
  <text x="562" y="274" class="mono-13">--audience: <tspan class="mono-key">api://AzureADTokenExchange</tspan></text>

  <text x="550" y="304" class="sub-11">O --subject precisa ser idêntico, caractere a caractere,</text>
  <text x="550" y="318" class="sub-11">ao par namespace/nome da ServiceAccount — qualquer</text>
  <text x="550" y="332" class="sub-11">divergência resulta em AADSTS70021 na troca do token.</text>

  <path d="M470,220 L528,220" class="arrow-blue"/>
  <text x="478" y="210" class="sub-11" fill="#0078d4">deve corresponder</text>

  <rect x="30" y="392" width="940" height="50" rx="8" class="field-box"/>
  <text x="46" y="416" class="sub-11">Ambos os lados (namespace:nome da ServiceAccount e --subject da Federated Identity Credential) são</text>
  <text x="46" y="430" class="sub-11">configurados manualmente e de forma independente — não há geração automática de um a partir do outro.</text>
</svg>
