<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', Arial, sans-serif">
  <style>
    .caption { fill: #1a1d23; font-size: 18px; font-weight: 700; }
    .cr-box { fill: #ffffff; stroke: #2f6fed; stroke-width: 1.5; }
    .field-box { fill: #f7f9ff; stroke: #5b8def; stroke-width: 1.5; }
    .topo-box { fill: #ffffff; stroke: #9aa1ad; stroke-width: 1.5; }
    .title-14 { fill: #1a1d23; font-size: 14px; font-weight: 700; }
    .title-13 { fill: #1a1d23; font-size: 13px; font-weight: 700; }
    .sub-12 { fill: #6b7280; font-size: 12px; }
    .sub-11 { fill: #6b7280; font-size: 11px; }
    .sub-10 { fill: #6b7280; font-size: 10.5px; }
  </style>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <text x="30" y="34" class="caption">iris-cluster.yaml — Custom Resource IrisCluster</text>

  <!-- Outer CR -->
  <rect x="40" y="56" width="820" height="340" rx="10" class="cr-box"/>
  <text x="60" y="80" class="title-14">kind: IrisCluster</text>
  <text x="60" y="98" class="sub-12">metadata.name: iko-test</text>

  <!-- top-level fields -->
  <rect x="60" y="112" width="250" height="76" rx="8" class="field-box"/>
  <text x="76" y="132" class="title-13">licenseKeySecret</text>
  <text x="76" y="148" class="sub-11">name: iris-license</text>
  <text x="76" y="164" class="sub-10">(opcional p/ Community)</text>

  <rect x="325" y="112" width="250" height="76" rx="8" class="field-box"/>
  <text x="341" y="132" class="title-13">imagePullSecrets</text>
  <text x="341" y="148" class="sub-11">name: intersystems-pull-secret</text>
  <text x="341" y="164" class="sub-10">(registry ICR)</text>

  <rect x="590" y="112" width="250" height="76" rx="8" class="field-box"/>
  <text x="606" y="132" class="title-13">storageClassName</text>
  <text x="606" y="148" class="sub-11">serviceTemplate.spec.type</text>
  <text x="606" y="164" class="sub-10">LoadBalancer / ClusterIP</text>

  <!-- topology label -->
  <text x="60" y="212" class="title-14">spec.topology</text>

  <rect x="60" y="224" width="190" height="150" rx="8" class="topo-box"/>
  <text x="76" y="246" class="title-13">data</text>
  <text x="76" y="264" class="sub-11">image: iris:&lt;tag&gt;</text>
  <text x="76" y="280" class="sub-11">mirrored: true</text>
  <text x="76" y="296" class="sub-11">shards: (sharding opc.)</text>
  <text x="76" y="312" class="sub-11">storage.resources</text>
  <text x="76" y="328" class="sub-11">.requests.storage</text>
  <text x="76" y="352" class="sub-10">define nº de data nodes</text>
  <text x="76" y="366" class="sub-10">e se há mirror</text>

  <rect x="266" y="224" width="190" height="150" rx="8" class="topo-box"/>
  <text x="282" y="246" class="title-13">compute</text>
  <text x="282" y="264" class="sub-11">image: iris:&lt;tag&gt;</text>
  <text x="282" y="280" class="sub-11">replicas: N</text>
  <text x="282" y="352" class="sub-10">nós de aplicação</text>
  <text x="282" y="366" class="sub-10">(application servers)</text>

  <rect x="472" y="224" width="190" height="150" rx="8" class="topo-box"/>
  <text x="488" y="246" class="title-13">webgateway</text>
  <text x="488" y="264" class="sub-11">image: webgateway:&lt;tag&gt;</text>
  <text x="488" y="280" class="sub-11">type: apache-lockeddown</text>
  <text x="488" y="296" class="sub-11">replicas: 1</text>
  <text x="488" y="352" class="sub-10">distribuição de requisições</text>
  <text x="488" y="366" class="sub-10">/ ponto de entrada HTTP</text>

  <rect x="678" y="224" width="162" height="150" rx="8" class="topo-box"/>
  <text x="694" y="246" class="title-13">arbiter</text>
  <text x="694" y="264" class="sub-11">image: iris:&lt;tag&gt;</text>
  <text x="694" y="352" class="sub-10">árbitro do mirror</text>
  <text x="694" y="366" class="sub-10">(alta disponibilidade)</text>
</svg>
